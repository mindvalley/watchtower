name: Tests

# Scores move when this code moves: a change here changes every board.
#
# One job per half of the repository. Neither is filtered by path — a filter is
# how a half stops being watched, which has already happened twice here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # All dependencies are for development only and are not installed while
      # running.
      - run: npm ci --no-audit --no-fund

      - run: npm test

      - name: The committed bundles match the sources
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "dist/ does not match scripts/benchmark — run npm run build and commit the result" >&2
            git status --porcelain -- dist >&2
            exit 1
          fi

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard

    # Required: the integration tests skip without DATABASE_URL and the run goes
    # green having checked nothing. They migrate their own schema, so a running
    # Postgres is all they need. Same image as the compose file we ship.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - run: npm ci --no-audit --no-fund

      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
