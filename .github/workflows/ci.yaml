name: Tests

# Scores move when this code moves: a change here changes every board.
#
# One job per half of the repository. Neither is filtered by path — a filter is
# how a half stops being watched, which has already happened twice here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # js-yaml is the engine's only dependency. Installing from the lockfile so
      # a test run cannot silently pick up a different version of the parser
      # that reads OpenAPI files out of the repositories we scan.
      - run: npm ci --no-audit --no-fund

      - run: npm test

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard

    # Required: the integration tests skip without DATABASE_URL and the run goes
    # green having checked nothing. They migrate their own schema, so a running
    # Postgres is all they need. Same image as the compose file we ship.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      # The board asks for 22 or newer; the scanner runs on 20.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm ci --no-audit --no-fund

      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
