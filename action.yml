name: Watchtower Engine
description: >-
  Installs the Agentic Compatibility Benchmark scanning engine and the exact
  scanner versions it is calibrated against. Scans a repository without ever
  compiling or running the code it measures.

# WHY THIS IS AN ACTION AND NOT A PACKAGE
#
# The engine is Node code, but the numbers it produces depend just as much on
# the six outside scanners as on the code. A package would carry the code and
# leave every caller to pin six tools by hand — and a caller one version behind
# on any of them reports scores that look comparable and are not. Bundling the
# code and the pins as one versioned unit is the whole point: every org that
# uses @<same-tag> measures with the same ruler.
#
# Change a pin and you have changed the measurement. Treat a pin bump as a
# scoring change: re-scan everything and compare, don't assume it is inert.

inputs:
  node-version:
    description: Node version used to run the engine.
    required: false
    default: "24"
  config:
    description: >-
      Path to the watchtower configuration, relative to the workspace. Read
      before anything is installed so that only the toolchains the configuration
      declares are installed. Falls back to $WATCHTOWER_CONFIG and then to
      watchtower.config.json; if none of those can be read, every toolchain is
      installed, which is what happened before this input existed.
    required: false
    default: ""
  elixir-version:
    description: >-
      Elixir, for Credo (complexity on Elixir source) and the two AST helpers
      the C2 reader uses on Elixir systems. Installed only when a system in the
      configuration declares the elixir stack.
    required: false
    default: "1.18"
  otp-version:
    description: Erlang/OTP, required by the Elixir toolchain.
    required: false
    default: "27"
  ruby-version:
    description: >-
      Ruby, for Rubocop (complexity on Ruby source). Installed only when a
      system in the configuration declares the ruby stack.
    required: false
    default: "3.3"
  install-elixir:
    description: >-
      auto | true | false. `auto` derives from the declared stacks. Force it on
      for the one case the configuration cannot express: a repository whose
      material languages are not the stack it is declared as — C8 measures every
      language it finds, not the declared one.
    required: false
    default: "auto"
  install-ruby:
    description: auto | true | false. As install-elixir.
    required: false
    default: "auto"

outputs:
  engine-path:
    description: >-
      Absolute path to the engine. Scan programs live at
      <engine-path>/scripts/benchmark/scan-*.js
    # Handed out by the first step below rather than read directly here.
    # github.action_path does not resolve in this block — it exists only inside
    # the action's own steps — so this was an empty string for every caller.
    value: ${{ steps.locate.outputs.engine-path }}

runs:
  using: composite
  steps:
    # First, so a broken handover costs a second rather than the two minutes it
    # takes to install six scanners.
    #
    # An empty path is not a visible failure by itself: the caller joins it to a
    # filename and node reports a missing module at /scripts/benchmark/..., which
    # reads like a broken engine rather than a broken handover. This says where
    # the engine is only after checking something is there.
    - name: Locate the engine
      id: locate
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f "${GITHUB_ACTION_PATH}/scripts/benchmark/scan-security.js" ]; then
          echo "The engine is not where this action is: ${GITHUB_ACTION_PATH}" >&2
          exit 1
        fi
        echo "engine-path=${GITHUB_ACTION_PATH}" >> "$GITHUB_OUTPUT"


    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    # The engine declares exactly one dependency (js-yaml, used by the OpenAPI
    # reader). Installing into the action's own directory keeps it off the
    # caller's dependency tree entirely.
    - name: Install engine dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install --no-audit --no-fund

    # Ask the configuration what it needs before installing anything for it.
    #
    # Elixir, OTP and Ruby were installed on every run regardless, while the
    # scanner they were installed for already read the declared stack to decide
    # whether to use them. So an organisation with no Elixir systems built the
    # whole BEAM toolchain and never invoked it.
    #
    # Deliberately after setup-node rather than first: this reads the config
    # with the same Node the scan will run under, instead of whatever the runner
    # image happens to ship. It costs nothing — the toolchain installs are the
    # slow part and they are all below this.
    #
    # The reasoning goes to the step log. An install decision nobody can see the
    # working for is the kind that gets blamed for an unrelated failure later.
    - name: Which toolchains does the configuration ask for
      id: toolchains
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        WATCHTOWER_CONFIG_INPUT: ${{ inputs.config }}
        INSTALL_ELIXIR: ${{ inputs.install-elixir }}
        INSTALL_RUBY: ${{ inputs.install-ruby }}
      run: |
        set -euo pipefail
        node "${GITHUB_ACTION_PATH}/scripts/benchmark/required-toolchains.js"

    - uses: erlef/setup-beam@v1
      if: steps.toolchains.outputs.elixir == 'true'
      with:
        otp-version: ${{ inputs.otp-version }}
        elixir-version: ${{ inputs.elixir-version }}

    - uses: ruby/setup-ruby@v1
      if: steps.toolchains.outputs.ruby == 'true'
      with:
        ruby-version: ${{ inputs.ruby-version }}

    # Versions come from scripts/benchmark/scanner-pins.json, which is the one
    # place they are written down — previously they were literals here and in
    # the prose describing them, and a second copy is a second answer. The file
    # also names the three tools that are NOT pinned, which the literals never
    # did.
    - name: Install pinned scanners
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # Install to a runner-writable dir — /usr/local/bin needs sudo on
        # ubuntu-24.04 images. $HOME/.local/bin is put on PATH below.
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        pin() {
          node -p "require('./scripts/benchmark/scanner-pins.json').pinned['$1'] || (console.error('no pin for $1'), process.exit(1))"
        }
        GITLEAKS_VERSION="$(pin gitleaks)"
        TRIVY_VERSION="$(pin trivy)"
        SEMGREP_VERSION="$(pin semgrep)"
        LIZARD_VERSION="$(pin lizard)"
        GRAPHIFY_VERSION="$(pin graphifyy)"

        # Secrets. Direct tarball, not install.sh: the installer silently 404s
        # once a release is purged, which leaves you with no scanner and a
        # successful-looking step.
        curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" gitleaks

        # Dependency CVEs.
        curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" trivy

        # Static analysis.
        pipx install "semgrep==${SEMGREP_VERSION}"
        # Cyclomatic complexity for everything that is not Elixir or Ruby.
        pipx install "lizard==${LIZARD_VERSION}"
        # Code graph for domain boundaries. Deterministic and fully offline.
        pipx install "graphifyy==${GRAPHIFY_VERSION}"

    # Rubocop needs the Ruby the step above may not have installed, so it is its
    # own step with the same condition rather than a line inside the block
    # above. Left in place it would fall back to the runner image's system Ruby
    # and install a gem nothing in the run is going to call.
    #
    # NOT PINNED, and this is a real gap rather than a decision — see the
    # `floating` block in scanner-pins.json. rubocop resolves to whatever is
    # current, as does jscpd (fetched on demand via npx inside the scan), and
    # credo is a `~> 1.7` range. So Ruby complexity, duplication and Elixir
    # complexity can move between two runs of the SAME engine tag. Pinning them
    # is a scoring change and wants its own re-scan.
    - name: Install rubocop
      if: steps.toolchains.outputs.ruby == 'true'
      shell: bash
      run: gem install rubocop --no-document
