name: Watchtower Engine
description: >-
  Installs the Agentic Compatibility Benchmark scanning engine and the exact
  scanner versions it is calibrated against. Scans a repository without ever
  compiling or running the code it measures.

# WHY THIS IS AN ACTION AND NOT A PACKAGE
#
# The engine is Node code, but the numbers it produces depend just as much on
# the six outside scanners as on the code. A package would carry the code and
# leave every caller to pin six tools by hand — and a caller one version behind
# on any of them reports scores that look comparable and are not. Bundling the
# code and the pins as one versioned unit is the whole point: every org that
# uses @<same-tag> measures with the same ruler.
#
# Change a pin and you have changed the measurement. Treat a pin bump as a
# scoring change: re-scan everything and compare, don't assume it is inert.

inputs:
  node-version:
    description: Node version used to run the engine.
    required: false
    default: "20"
  elixir-version:
    description: >-
      Elixir, for Credo (complexity on Elixir repos) and the two AST helpers
      the C2 reader still uses. Required today even for non-Elixir targets.
    required: false
    default: "1.18"
  otp-version:
    description: Erlang/OTP, required by the Elixir toolchain.
    required: false
    default: "27"
  ruby-version:
    description: Ruby, for Rubocop (complexity on Ruby repos).
    required: false
    default: "3.3"

outputs:
  engine-path:
    description: >-
      Absolute path to the engine. Scan programs live at
      <engine-path>/scripts/benchmark/scan-*.js
    # Handed out by the first step below rather than read directly here.
    # github.action_path does not resolve in this block — it exists only inside
    # the action's own steps — so this was an empty string for every caller.
    value: ${{ steps.locate.outputs.engine-path }}

runs:
  using: composite
  steps:
    # First, so a broken handover costs a second rather than the two minutes it
    # takes to install six scanners.
    #
    # An empty path is not a visible failure by itself: the caller joins it to a
    # filename and node reports a missing module at /scripts/benchmark/..., which
    # reads like a broken engine rather than a broken handover. This says where
    # the engine is only after checking something is there.
    - name: Locate the engine
      id: locate
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f "${GITHUB_ACTION_PATH}/scripts/benchmark/scan-security.js" ]; then
          echo "The engine is not where this action is: ${GITHUB_ACTION_PATH}" >&2
          exit 1
        fi
        echo "engine-path=${GITHUB_ACTION_PATH}" >> "$GITHUB_OUTPUT"

        # The ref the caller followed — `v1`, or a branch, or a SHA — exported
        # so the rest of the job can read it.
        #
        # It has to be done HERE. GITHUB_ACTION_REF exists only inside this
        # action's own steps, and the programs that record it run as ordinary
        # steps in the caller's workflow, where it is simply absent. The first
        # version read it directly from the publisher and every CI run recorded
        # itself as `local`, which is the one wrong answer that matters: it says
        # somebody's laptop when it was a scheduled scan.
        echo "WATCHTOWER_ENGINE_REF=${{ github.action_ref }}" >> "$GITHUB_ENV"

    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    # The engine declares exactly one dependency (js-yaml, used by the OpenAPI
    # reader). Installing into the action's own directory keeps it off the
    # caller's dependency tree entirely.
    - name: Install engine dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install --no-audit --no-fund

    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ inputs.otp-version }}
        elixir-version: ${{ inputs.elixir-version }}

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}

    # Versions come from scripts/benchmark/scanner-pins.json, which is the one
    # place they are written down. They used to be literals here, which meant
    # the engine could not state which scanners produced a score without
    # reading a file above its own directory — and that boundary is what makes
    # the engine extractable at all. Moving them inside it removes the second
    # copy as well: a pin and the digest that identifies it cannot disagree.
    - name: Install pinned scanners
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # Install to a runner-writable dir — /usr/local/bin needs sudo on
        # ubuntu-24.04 images. $HOME/.local/bin is put on PATH below.
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        pin() {
          node -p "require('./scripts/benchmark/scanner-pins.json').pinned['$1'] || (console.error('no pin for $1'), process.exit(1))"
        }
        GITLEAKS_VERSION="$(pin gitleaks)"
        TRIVY_VERSION="$(pin trivy)"
        SEMGREP_VERSION="$(pin semgrep)"
        LIZARD_VERSION="$(pin lizard)"
        GRAPHIFY_VERSION="$(pin graphifyy)"

        # Secrets. Direct tarball, not install.sh: the installer silently 404s
        # once a release is purged, which leaves you with no scanner and a
        # successful-looking step.
        curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" gitleaks

        # Dependency CVEs.
        curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" trivy

        # Static analysis.
        pipx install "semgrep==${SEMGREP_VERSION}"
        # Cyclomatic complexity for everything that is not Elixir or Ruby.
        pipx install "lizard==${LIZARD_VERSION}"
        # Code graph for domain boundaries. Deterministic and fully offline.
        pipx install "graphifyy==${GRAPHIFY_VERSION}"

        # NOT PINNED, and this is a real gap rather than a decision — see the
        # `floating` block in scanner-pins.json. rubocop resolves to whatever is
        # current, as does jscpd (fetched on demand via npx inside the scan), and
        # credo is a `~> 1.7` range. So Ruby complexity, duplication and Elixir
        # complexity can move between two runs of the SAME engine tag. Pinning
        # them is a scoring change and wants its own re-scan.
        gem install rubocop --no-document
