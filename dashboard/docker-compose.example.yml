services:
  postgres18:
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    hostname: postgres18
    image: docker.io/postgres:18-alpine
    command: -c 'max_connections=500'
    networks:
      - dashboard
    ports:
      # Overridable, because 5432 is the one port a developer machine is most
      # likely to have taken already — by another project's database, which is
      # exactly the kind of machine this gets cloned onto. Set
      # WATCHTOWER_DB_PORT and put the same number in DATABASE_URL.
      - ${WATCHTOWER_DB_PORT:-5432}:5432
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:

networks:
  dashboard:
