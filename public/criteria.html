<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criteria Reference — Agent Watchtower</title>
<meta name="description" content="The Agentic Compatibility Benchmark criteria — what each measures, why it exists, and how it is assessed.">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Criteria Reference — Agent Watchtower">
<meta property="og:description" content="The Agentic Compatibility Benchmark criteria — what each measures, why, and how.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<script src="/js/loading.js"></script>
</head>
<body>
<div class="page">

  <a href="/" class="back-link">← Agent Watchtower</a>

  <header class="header">
    <div>
      <div class="header-title">Criteria Reference</div>
      <div class="header-sub">Agentic Compatibility Benchmark</div>
    </div>
    <div class="header-badge" id="updated-badge"></div>
  </header>

  <main>
    <div class="crit-legend" id="legend"></div>
    <div class="crit-list" id="criteria-list"></div>
  </main>

  <footer class="footer">
    <span>Agentic Compatibility Benchmark</span>
    <span id="footer-note"></span>
  </footer>

</div>
<script>
const STATUS_CLASS = { scored: 'status-scored', pending: 'status-pending' };

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// `n` is the contiguous display position (1..N); c.id is the internal/data key.
function renderItem(c, n) {
  const statusClass = STATUS_CLASS[c.status] || 'status-pending';
  return `
    <a class="crit-list-item" href="/criteria/${c.slug}">
      <div class="crit-list-head">
        <span class="crit-id">${n}</span>
        <span class="crit-name">${esc(c.name)}</span>
        <span class="status-chip ${statusClass}">${esc(c.status)}</span>
        <span class="crit-list-arrow">read →</span>
      </div>
      <div class="crit-list-desc">${esc(c.one_liner)}</div>
    </a>`;
}

async function init() {
  try {
    const data = await Loading.withLoading(
      document.getElementById('criteria-list'),
      'Loading criteria…',
      () => Loading.getJson('/data/criteria-docs.json'),
    );
    const criteria = data.criteria || [];

    const legend = data.status_legend || {};
    document.getElementById('legend').innerHTML = Object.entries(legend).map(([k, v]) =>
      `<span><span class="status-chip ${STATUS_CLASS[k] || ''}">${esc(k)}</span>${esc(v)}</span>`).join('');

    document.getElementById('criteria-list').innerHTML =
      criteria.map((c, i) => renderItem(c, i + 1)).join('');

    if (data.last_updated) {
      document.getElementById('updated-badge').textContent = `Updated ${data.last_updated}`;
      document.getElementById('footer-note').textContent = `Reference updated ${data.last_updated}`;
    }
  } catch (e) {
    console.error('Failed to load criteria docs:', e);
    document.getElementById('criteria-list').innerHTML =
      '<div class="panel"><p style="color:var(--text-muted)">Could not load criteria reference.</p></div>';
  }
}

init();
</script>
</body>
</html>
